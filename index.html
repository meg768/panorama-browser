<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panorama Browser X</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182b32; background: #f3f6f5; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        main { max-width: 1100px; margin: 0 auto; padding: clamp(24px, 5vw, 64px) 20px; }
        header { margin-bottom: 32px; }
        h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.04em; }
        #status { margin: 0; color: #52676f; line-height: 1.6; }
        ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; padding: 0; margin: 0; list-style: none; }
        li { min-width: 0; }
        a { display: block; height: 100%; border: 1px solid #d8e2df; border-radius: 12px; overflow: hidden; background: #fff; color: #174e46; text-decoration: none; line-height: 1.5; }
        a:hover { background: #eaf4ef; border-color: #8bafa4; }
        a:focus-visible { outline: 3px solid #247a6b; outline-offset: 3px; }
        .path { display: block; padding: 16px; overflow-wrap: anywhere; }
        .thumbnail { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain; background: #e3ebe7; }
    </style>
</head>
<body>
<main>
    <header>
        <h1>Panorama Browser X</h1>
        <p id="status" role="status">Loading panoramas…</p>
    </header>
    <noscript>Enable JavaScript to display the panorama list.</noscript>
    <ul id="panoramas" aria-label="Panoramas"></ul>
</main>
<script>
    const list = document.getElementById('panoramas');
    const status = document.getElementById('status');
    let previousManifest = '';

    async function loadPanoramas() {
        try {
            const response = await fetch('./panoramas.json', { cache: 'no-store' });
            if (!response.ok) throw new Error('Manifest unavailable');
            const entries = await response.json();
            const fingerprint = JSON.stringify(entries);
            if (fingerprint !== previousManifest) {
                const fragment = document.createDocumentFragment();
                for (const entry of entries) {
                    const item = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = entry.url;
                    const path = document.createElement('span');
                    path.className = 'path';
                    path.textContent = entry.path;
                    if (entry.thumbnail) {
                        const image = document.createElement('img');
                        image.className = 'thumbnail';
                        image.src = entry.thumbnail;
                        image.alt = '';
                        image.width = 640;
                        image.height = 360;
                        image.loading = 'lazy';
                        image.decoding = 'async';
                        link.append(image);
                    }
                    link.append(path);
                    item.append(link);
                    fragment.append(item);
                }
                list.replaceChildren(fragment);
                previousManifest = fingerprint;
            }
            status.textContent = entries.length === 0 ? 'No panoramas yet.' :
                `${entries.length} ${entries.length === 1 ? 'panorama' : 'panoramas'}`;
        } catch (error) {
            status.textContent = 'Unable to update the panorama list. Retrying shortly.';
        }
    }

    loadPanoramas();
    setInterval(loadPanoramas, 60000);
</script>
</body>
</html>
