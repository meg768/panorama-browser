<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panoramas</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #eef2ef;
            background: #111517;
            --surface: #1a2023;
            --border: #2b3437;
            --muted: #9caaa6;
            --accent: #a7cbbb;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: clamp(28px, 4.5vw, 56px) clamp(20px, 4vw, 48px) 64px;
        }
        #status { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
        ul {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            padding: 0;
            margin: 0;
            list-style: none;
        }
        li { min-width: 0; }
        a {
            display: block;
            height: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            color: inherit;
            text-decoration: none;
            line-height: 1.5;
            transition: background-color .18s ease, border-color .18s ease, transform .18s ease;
        }
        @media (hover: hover) {
            a:hover {
                background: #222b2e;
                border-color: #52665d;
                transform: translateY(-2px);
            }
        }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
        .caption { display: block; padding: 16px 18px 18px; overflow-wrap: anywhere; }
        .location { display: block; color: var(--muted); font-size: .8125rem; line-height: 1.5; }
        .title { display: block; font-size: 1rem; font-weight: 600; letter-spacing: -.01em; }
        .location + .title { margin-top: 5px; }
        .thumbnail {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: #14191b;
        }
        @media (max-width: 800px) {
            ul { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        }
        @media (max-width: 560px) {
            main { padding-top: 28px; }
            ul { grid-template-columns: minmax(0, 1fr); }
        }
        @media (prefers-reduced-motion: reduce) {
            a { transition: none; }
            a:hover { transform: none; }
        }
    </style>
</head>
<body>
<main>
    <p id="status" role="status">Loading panoramas…</p>
    <noscript>Enable JavaScript to display the panorama list.</noscript>
    <ul id="panoramas" aria-label="Panoramas"></ul>
</main>
<script>
    const list = document.getElementById('panoramas');
    const status = document.getElementById('status');
    const galleryRoot = new URL('./', location.href);
    const listingRoot = new URL('/_panorama-list/', location.origin);

    function childLink(href, directory) {
        if (!href || href.startsWith('?') || href.startsWith('#')) return null;
        const url = new URL(href, directory);
        if (url.origin !== listingRoot.origin || url.search || url.hash ||
            !url.pathname.startsWith(directory.pathname)) return null;
        const isDirectory = url.pathname.endsWith('/');
        const encoded = url.pathname.slice(directory.pathname.length).replace(/\/$/, '');
        if (!encoded || encoded.includes('/')) return null;
        const name = decodeURIComponent(encoded);
        if (!name || name === '.' || name === '..' || /[/\\]/.test(name)) return null;
        return { name, isDirectory };
    }

    async function readDirectory(parts) {
        const relative = parts.map(encodeURIComponent).join('/');
        const directory = new URL(relative ? relative + '/' : '', listingRoot);
        directory.search = '?F=0';
        const response = await fetch(directory, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
        if (!response.ok || new URL(response.url).pathname !== directory.pathname ||
            new URL(response.url).origin !== listingRoot.origin) throw new Error('Directory unavailable');
        const document = new DOMParser().parseFromString(await response.text(), 'text/html');
        if (!document.querySelector('h1')?.textContent.startsWith('Index of '))
            throw new Error('Directory listing expected');
        const children = new Map();
        for (const anchor of document.querySelectorAll('a[href]')) {
            try {
                const child = childLink(anchor.getAttribute('href'), directory);
                if (child) children.set(child.name, child);
            } catch { /* Ignore malformed URL encodings without losing valid entries. */ }
        }
        return children;
    }

    function captionForPath(path) {
        const parts = path.split('/');
        const filename = parts.pop().replace(/\.html$/i, '');
        const readable = segment => segment.replace(/[-_]/g, ' ')
            .replace(/^./u, first => first.toUpperCase());
        return { location: parts.map(readable).join(' · '), title: readable(filename) };
    }

    function render(entries, errors) {
        const fragment = document.createDocumentFragment();
        entries.sort((a, b) => a.path < b.path ? -1 : a.path > b.path ? 1 : 0);
        for (const entry of entries) {
            const item = document.createElement('li');
            const link = document.createElement('a');
            link.href = entry.url;
            const caption = document.createElement('span');
            caption.className = 'caption';
            const text = captionForPath(entry.path);
            if (text.location) {
                const location = document.createElement('span');
                location.className = 'location';
                location.textContent = text.location;
                caption.append(location);
            }
            const title = document.createElement('span');
            title.className = 'title';
            title.textContent = text.title;
            caption.append(title);
            if (entry.thumbnail) {
                const image = document.createElement('img');
                image.className = 'thumbnail';
                image.src = entry.thumbnail;
                image.alt = '';
                image.width = 640;
                image.height = 360;
                image.loading = 'lazy';
                image.decoding = 'async';
                image.addEventListener('error', () => image.remove(), { once: true });
                link.append(image);
            }
            link.append(caption);
            item.append(link);
            fragment.append(item);
        }
        list.replaceChildren(fragment);
        const count = entries.length === 0 ? 'No panoramas yet.' :
            entries.length + (entries.length === 1 ? ' panorama' : ' panoramas');
        status.textContent = errors ? count + ' — Some folders could not be read. Refresh to retry.' : count;
        status.hidden = !errors && entries.length > 0;
    }

    async function loadPanoramas() {
        const queue = [[]];
        const visited = new Set(['']);
        const entries = [];
        let errors = 0;
        try {
            while (queue.length) {
                const batch = queue.splice(0, 4);
                const results = await Promise.allSettled(batch.map(readDirectory));
                for (let i = 0; i < results.length; i++) {
                    const parts = batch[i];
                    const result = results[i];
                    if (result.status === 'rejected') {
                        if (parts.length === 0) throw result.reason;
                        errors++;
                        continue;
                    }
                    const children = result.value;
                    for (const child of children.values()) {
                        const childParts = [...parts, child.name];
                        const path = childParts.join('/');
                        if (child.isDirectory) {
                            if (visited.has(path)) continue;
                            if (childParts.length > 32 || visited.size >= 1000) { errors++; continue; }
                            visited.add(path);
                            queue.push(childParts);
                        } else if (/\.html$/i.test(child.name) && path !== 'index.html') {
                            const url = new URL(childParts.map(encodeURIComponent).join('/'), galleryRoot).href;
                            const jpgName = child.name.slice(0, -5) + '.jpg';
                            const jpg = children.get(jpgName);
                            const thumbnail = jpg && !jpg.isDirectory ?
                                new URL([...parts, jpgName].map(encodeURIComponent).join('/'), galleryRoot).href :
                                undefined;
                            entries.push({ path, url, thumbnail });
                        }
                    }
                }
            }
            render(entries, errors);
        } catch {
            status.textContent = 'Unable to load panoramas. Refresh to retry.';
        }
    }

    loadPanoramas();
</script>
</body>
</html>
